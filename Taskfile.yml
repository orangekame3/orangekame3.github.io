version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  dev:
    desc: Start development server
    cmds:
      - npm run dev

  build:
    desc: Build for production
    cmds:
      - npm run build

  preview:
    desc: Preview production build
    cmds:
      - npm run preview

  import:
    desc: Import blog posts from Obsidian vault
    cmds:
      - npm run import:vault

  publish:
    desc: Import from vault and build
    cmds:
      - task: import
      - task: build
