name: Update GitHub stars

on:
  schedule:
    - cron: "0 3 * * 1" # Weekly (Mon 03:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run stars:update

      - name: Create PR if changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update GitHub stars"
          title: "chore: update GitHub stars"
          body: "Automated weekly refresh of GitHub star counts."
          branch: "chore/update-github-stars"
          delete-branch: true
          add-paths: |
            src/data/projectStars.ts

